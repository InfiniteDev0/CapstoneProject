# =============================================================================
#  LuxuryShop API (the kitchen) settings
# =============================================================================
spring.application.name=luxuryshop-api
server.port=8080

# Secrets come from the project's root .env (git-ignored), never from this file.
# ../../.env when started from apps/api (mvnw), ./.env when started from the root.
spring.config.import=optional:file:../../.env[.properties],optional:file:./.env[.properties]

# --- MySQL: the receipt book -------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:luxuryshop}?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:luxury_app}
spring.datasource.password=${MYSQL_PASSWORD:}

# The tables already exist (database/mysql/schema.sql). "validate" only CHECKS
# that our Java classes match them; it never creates, changes or drops a table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- MongoDB: the menu album -------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:luxuryshop}

# We log people in ourselves (JWT for /api, our own login for the web pages), so switch
# off Spring's built-in demo user and its "generated security password".
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- JWT: the wristband ------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- CORS: other websites that may call /api from a browser (none by default:
# the shop and admin pages are served by this app itself, on the same origin)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# --- Swagger UI --------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true

# --- Web pages (Thymeleaf) -----------------------------------------------------
# Shop at /, admin at /admin. Pages use a session login + CSRF; /api keeps JWT.
spring.thymeleaf.cache=true
# <input type=date> sends 2026-11-14 (ISO)
spring.mvc.format.date=iso
server.servlet.session.timeout=8h
server.servlet.session.cookie.name=LS_SESSION
server.servlet.session.cookie.same-site=lax
# Admin photo uploads (git-ignored), served at /uploads/**
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=40MB
