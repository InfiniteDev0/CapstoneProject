# =============================================================================
#  Vela Noire API (the kitchen) settings
# =============================================================================
spring.application.name=vela-noire-api
server.port=8080

# Secrets come from the project's root .env (git-ignored), never from this file.
# ../../.env when started from apps/api (mvnw), ./.env when started from the root.
spring.config.import=optional:file:../../.env[.properties],optional:file:./.env[.properties]

# --- MySQL: the receipt book -------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:vela_noire}?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:vela_app}
spring.datasource.password=${MYSQL_PASSWORD:}

# The tables already exist (database/mysql/schema.sql). "validate" only CHECKS
# that our Java classes match them; it never creates, changes or drops a table.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- MongoDB: the menu album -------------------------------------------------
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:vela_noire}

# We log people in ourselves (AuthService + JWT), so switch off Spring's
# built-in demo user and its "generated security password".
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# --- JWT: the wristband ------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- CORS: which websites may call the kitchen -------------------------------
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# --- Swagger UI --------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.persist-authorization=true
